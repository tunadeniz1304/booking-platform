# promtool birim testleri (v5 P0-5, v5#17): her alarm en az bir kez beklenen etiketlerle
# ateşlenir; seçili negatif durumlar ateşlenmemeyi doğrular.
#   promtool test rules alerts.test.yml   (CI: .github/workflows/ci.yml → workflow-lint)
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # --- SLO-1..4 ---
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{route="bookings",method="POST",status="201",le="1"}'
        values: "0x30"
      - series: 'http_request_duration_seconds_bucket{route="bookings",method="POST",status="201",le="2.5"}'
        values: "0+10x30"
      - series: 'http_request_duration_seconds_bucket{route="bookings",method="POST",status="201",le="+Inf"}'
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: BookingLatencyP99High
        exp_alerts: []
      - eval_time: 20m
        alertname: BookingLatencyP99High
        exp_alerts:
          - exp_labels: { severity: page, slo: booking-latency }
            exp_annotations:
              description: "p99 = 2.485s (SLO: < 1 s). Kilit çekişmesi, DB havuzu veya Redis gecikmesini kontrol edin."
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/booking-latency-p99-high.md
              summary: Rezervasyon/tutma p99 gecikmesi 1 s üstünde

  - interval: 1m
    input_series:
      - series: 'payment_attempts_total{outcome="confirmed"}'
        values: "0+1x60"
      - series: 'payment_attempts_total{outcome="capture_failed"}'
        values: "0+1x60"
      - series: 'cart_payment_total{outcome="confirmed"}'
        values: "0x60"
      - series: 'cart_payment_total{outcome="capture_failed"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentSuccessRatioLow
        exp_alerts:
          - exp_labels: { severity: page, slo: payment-success }
            exp_annotations:
              description: Oran 50%. PSP durumu, saga telafileri (saga_compensation_total) ve refund_retry_total'a bakın.
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payment-success-ratio-low.md
              summary: Ödeme başarı oranı %97 altında

  - interval: 1m
    input_series:
      - series: 'ledger_imbalance_total{source="journal"}'
        values: "0 0 0 1 1 1 1"
      - series: "ledger_reconciliation_runs_total"
        values: "0x150"
      - series: 'takedown_sla_breach_total{source="dsa"}'
        values: "0 1 1"
    alert_rule_test:
      - eval_time: 5m
        alertname: LedgerImbalanceDetected
        exp_alerts:
          - exp_labels: { severity: page, slo: ledger-balance, source: journal }
            exp_annotations:
              description: ledger_imbalance_total arttı. Ödemeleri durdurmayı değerlendirin; docs/observability/SLO.md runbook.
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/ledger-imbalance-detected.md
              summary: Çift girişli defterde dengesizlik (journal)
      - eval_time: 2h
        alertname: LedgerReconciliationNotRunning
        exp_alerts:
          - exp_labels: { severity: ticket, slo: ledger-balance }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/ledger-reconciliation-not-running.md
              summary: Günlük defter mutabakatı 26 saattir koşmadı
      - eval_time: 2m
        alertname: TakedownSlaBreached
        exp_alerts:
          - exp_labels: { severity: page, slo: takedown-sla, source: dsa }
            exp_annotations:
              description: Yasal süre (varsayılan 24 saat) doldu; /admin/compliance kuyruğunu işleyin.
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/takedown-sla-breached.md
              summary: Kaldırma talebi SLA'sı aşıldı (dsa)

  # --- Para hijyeni ---
  - interval: 1m
    input_series:
      - series: 'refund_retry_total{outcome="failed"}'
        values: "0+1x40"
      - series: 'payment_late_success_total{outcome="refunded"}'
        values: "0+1x30"
      - series: 'cart_late_success_total{outcome="refunded"}'
        values: "0x30"
      - series: 'payment_capture_race_total{action="void"}'
        values: "0+2x20"
      - series: 'split_plan_total{outcome="aborted"}'
        values: "0+1x20"
      - series: 'confirm_retry_total{outcome="refunded"}'
        values: "0+1x30"
      - series: 'confirm_retry_total{outcome="exhausted"}'
        values: "0 1 1"
      - series: 'payouts_total{kind="host",outcome="failed"}'
        values: "0 1 1"
      - series: 'llm_tokens_total{route="review_summary"}'
        values: "0+100000x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: RefundRetryFailing
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/refund-retry-failing.md
              summary: Başarısız iade yeniden denemeleri birikiyor
      - eval_time: 20m
        alertname: LatePaymentRefundSpike
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/late-payment-refund-spike.md
              summary: Geç gelen başarılı ödemeler topluca iade ediliyor (tutma TTL'i / PSP gecikmesi?)
      - eval_time: 15m
        alertname: CaptureRaceCompensations
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/capture-race-compensations.md
              summary: Çok sayıda yarış kaybı telafisi (çift ödeme denemesi) — istemci yeniden denemelerini inceleyin
      - eval_time: 15m
        alertname: SplitPlansAborting
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/split-plans-aborting.md
              summary: Bölünmüş ödeme planları iptal oluyor (süre sonu ya da onay adımında serileştirme çakışması — abortReason'a bakın)
      - eval_time: 20m
        alertname: ConfirmRetryRefunds
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/confirm-retry-refunds.md
              summary: Ertelenen ödeme onaylarından saatte 5+ iade — SERIALIZABLE çakışma / envanter baskısı
      - eval_time: 2m
        alertname: ConfirmRetryExhausted
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/confirm-retry-exhausted.md
              summary: confirm-retry işi tüm denemelerde düştü — capture alınmış ödeme onaysız/iadesiz kalmış olabilir
      - eval_time: 2m
        alertname: PayoutFailures
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payout-failures.md
              summary: Ev sahibi / devir payout hatası
      - eval_time: 30m
        alertname: LlmTokenBurnHigh
        exp_alerts:
          - exp_labels: { severity: ticket, route: review_summary }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/llm-token-burn-high.md
              summary: LLM token tüketimi review_summary rotasında saatlik 2M üstünde

  # --- Saga: telafi düştü, yeniden deneme planlanmadı / tükendi ---
  - interval: 1m
    input_series:
      - series: 'saga_compensation_total{saga="booking_pay",step="capture",outcome="failed"}'
        values: "0 1 1 1"
      - series: 'saga_compensation_retry_total{saga="booking_pay",outcome="exhausted"}'
        values: "0 1 1 1"
    alert_rule_test:
      - eval_time: 3m
        alertname: SagaCompensationFailed
        exp_alerts:
          - exp_labels: { severity: ticket, saga: booking_pay, step: capture }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/saga-compensation-failed.md
              summary: Saga telafisi başarısız (booking_pay/capture) — otomatik yeniden deneme planlandı
      - eval_time: 3m
        alertname: SagaCompensationRetryNotScheduled
        exp_alerts:
          - exp_labels: { severity: page, saga: booking_pay }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/saga-compensation-retry-not-scheduled.md
              summary: Saga telafisi (booking_pay) başarısız ve yeniden deneme planlanamadı — PSP'de askıda tutar olabilir
      - eval_time: 3m
        alertname: SagaCompensationRetryExhausted
        exp_alerts:
          - exp_labels: { severity: page, saga: booking_pay }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/saga-compensation-retry-exhausted.md
              summary: Saga telafisi (booking_pay) tüm denemelerde düştü — elle void/iade (audit saga.compensation_exhausted)

  - interval: 1m
    input_series:
      - series: 'saga_compensation_total{saga="booking_pay",step="capture",outcome="failed"}'
        values: "0 1 1 1"
      - series: 'saga_compensation_retry_total{saga="booking_pay",outcome="scheduled"}'
        values: "0 1 1 1"
    alert_rule_test:
      # Yeniden deneme kuyruğa alındıysa sayfa atılmaz.
      - eval_time: 3m
        alertname: SagaCompensationRetryNotScheduled
        exp_alerts: []

  # --- SLO-5: rezervasyon başarısı burn-rate ---
  - interval: 1m
    input_series:
      # %10 5xx → 20x yanma (> 14,4x)
      - series: 'http_request_duration_seconds_count{route="bookings",method="POST",status="500"}'
        values: "0+1x60"
      - series: 'http_request_duration_seconds_count{route="bookings",method="POST",status="201"}'
        values: "0+9x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: BookingSuccessBurnRateFast
        exp_alerts:
          - exp_labels: { severity: page, slo: booking-success }
            exp_annotations:
              description: Tetikleyen uzun pencerede SLO dışı istek oranı 10%; bu hızla aylık bütçe günler içinde biter.
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/booking-success-burn-rate.md
              summary: Rezervasyon/tutma 5xx oranı SLO'yu (≥ %99,5) tehdit ediyor — hata bütçesi hızlı yanıyor

  - interval: 1m
    input_series:
      # %2 5xx → 4x yanma: hızlı eşiklerin (14,4x ve 6x) altında, yavaş eşiğin (3x) üstünde.
      - series: 'http_request_duration_seconds_count{route="cart.hold",method="POST",status="503"}'
        values: "0+2x200"
      - series: 'http_request_duration_seconds_count{route="cart.hold",method="POST",status="200"}'
        values: "0+98x200"
    alert_rule_test:
      - eval_time: 150m
        alertname: BookingSuccessBurnRateFast
        exp_alerts: []
      - eval_time: 150m
        alertname: BookingSuccessBurnRateSlow
        exp_alerts:
          - exp_labels: { severity: ticket, slo: booking-success }
            exp_annotations:
              description: 1 günlük oran 2% (bütçenin 3 katı).
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/booking-success-burn-rate.md
              summary: Rezervasyon/tutma 5xx oranı SLO'yu (≥ %99,5) tehdit ediyor — hata bütçesi yavaş ama sürekli yanıyor

  - interval: 1m
    input_series:
      # Sağlıklı: %0,2 5xx (0,4x) → alarm yok.
      - series: 'http_request_duration_seconds_count{route="bookings",method="POST",status="500"}'
        values: "0+1x200"
      - series: 'http_request_duration_seconds_count{route="bookings",method="POST",status="201"}'
        values: "0+499x200"
    alert_rule_test:
      - eval_time: 150m
        alertname: BookingSuccessBurnRateFast
        exp_alerts: []
      - eval_time: 150m
        alertname: BookingSuccessBurnRateSlow
        exp_alerts: []

  # --- SLO-6: 3DS ödeme onayı gecikmesi burn-rate ---
  - interval: 1m
    input_series:
      # İsteklerin %20'si 2,5 s üstü → 20x
      - series: 'http_request_duration_seconds_count{route="bookings.pay.confirm",method="POST",status="200"}'
        values: "0+10x60"
      - series: 'http_request_duration_seconds_bucket{route="bookings.pay.confirm",method="POST",status="200",le="2.5"}'
        values: "0+8x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: PaymentConfirmLatencyBurnRateFast
        exp_alerts:
          - exp_labels: { severity: page, slo: payment-confirm-latency }
            exp_annotations:
              description: Tetikleyen uzun pencerede SLO dışı istek oranı 20%; bu hızla aylık bütçe günler içinde biter.
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payment-confirm-latency-burn-rate.md
              summary: 3DS ödeme onayı p99 2,5 s SLO'su — hata bütçesi hızlı yanıyor

  - interval: 1m
    input_series:
      # %4 yavaş → 4x
      - series: 'http_request_duration_seconds_count{route="cart.pay.confirm",method="POST",status="200"}'
        values: "0+100x200"
      - series: 'http_request_duration_seconds_bucket{route="cart.pay.confirm",method="POST",status="200",le="2.5"}'
        values: "0+96x200"
    alert_rule_test:
      - eval_time: 150m
        alertname: PaymentConfirmLatencyBurnRateSlow
        exp_alerts:
          - exp_labels: { severity: ticket, slo: payment-confirm-latency }
            exp_annotations:
              description: 1 günlük oran 4% (bütçenin 3 katı).
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payment-confirm-latency-burn-rate.md
              summary: 3DS ödeme onayı p99 2,5 s SLO'su — hata bütçesi yavaş ama sürekli yanıyor

  # --- SLO-7: webhook gecikmesi burn-rate ---
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{route="payments.webhook",method="POST",status="200"}'
        values: "0+10x60"
      - series: 'http_request_duration_seconds_bucket{route="payments.webhook",method="POST",status="200",le="1"}'
        values: "0+8x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: WebhookLatencyBurnRateFast
        exp_alerts:
          - exp_labels: { severity: page, slo: webhook-latency }
            exp_annotations:
              description: Tetikleyen uzun pencerede SLO dışı istek oranı 20%; bu hızla aylık bütçe günler içinde biter.
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/webhook-latency-burn-rate.md
              summary: PSP webhook p99 1 s SLO'su — hata bütçesi hızlı yanıyor

  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{route="payments.webhook",method="POST",status="200"}'
        values: "0+100x200"
      - series: 'http_request_duration_seconds_bucket{route="payments.webhook",method="POST",status="200",le="1"}'
        values: "0+96x200"
    alert_rule_test:
      - eval_time: 150m
        alertname: WebhookLatencyBurnRateSlow
        exp_alerts:
          - exp_labels: { severity: ticket, slo: webhook-latency }
            exp_annotations:
              description: 1 günlük oran 4% (bütçenin 3 katı).
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/webhook-latency-burn-rate.md
              summary: PSP webhook p99 1 s SLO'su — hata bütçesi yavaş ama sürekli yanıyor

  # --- v5 hijyen ---
  - interval: 1m
    input_series:
      - series: 'payout_blocked_total{kind="host",reason="IDENTITY_UNVERIFIED"}'
        values: "0+1x60"
      - series: 'deposit_capture_sweep_total{outcome="failed"}'
        values: "0 1+0x60"
      - series: 'rnpl_charge_total{outcome="failed"}'
        values: "0+1x30"
      - series: 'support_handoff_total{reason="refund_request"}'
        values: "0+1x60"
      - series: 'support_chat_total{intent="refund",outcome="handoff"}'
        values: "0+1x60"
      - series: 'llm_eval_score{task="all",mode="demo"}'
        values: "0.9x60"
      - series: 'llm_eval_score{task="red_team",mode="demo"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: PayoutBlockedSpike
        exp_alerts:
          - exp_labels: { severity: ticket, kind: host, reason: IDENTITY_UNVERIFIED }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payout-blocked-spike.md
              summary: Saatte 10+ payout engellendi (host/IDENTITY_UNVERIFIED)
      - eval_time: 45m
        alertname: DepositCaptureSweepFailing
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/deposit-capture-sweep-failing.md
              summary: Takılı depozito tahsilatları taramada kapatılamıyor — PSP'de askıda tutar olabilir
      - eval_time: 20m
        alertname: RnplChargeFailures
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/rnpl-charge-failures.md
              summary: RNPL tahsilatlarında saatte 5+ başarısızlık/temerrüt
      - eval_time: 40m
        alertname: SupportHandoffRatioHigh
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/support-handoff-ratio-high.md
              summary: Destek ajanında insana devir oranı %50 üstünde
      - eval_time: 2m
        alertname: LlmEvalScoreLow
        exp_alerts:
          - exp_labels: { severity: ticket, task: all, mode: demo }
            exp_annotations:
              runbook_url: https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/llm-eval-score-low.md
              summary: LLM eval geçme oranı %95 altında (all/demo)
