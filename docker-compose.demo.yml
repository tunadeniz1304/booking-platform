# Demo override'ı (v4#5) — YALNIZCA yerel/portföy demosu için:
#
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
#
# Açar: DEMO_MODE (demo seed, /dev/mailbox, varsayılan MockPsp, kalıcı "DEMO"
# şeridi) ve düz http üzerinden çerez (COOKIE_SECURE=false). İnternete açık bir
# ortamda KULLANMAYIN; temel docker-compose.yml güvenli varsayılanlarla gelir.
x-demo-env: &demo-env
  DEMO_MODE: "true"
  COOKIE_SECURE: "false"
  # Tam e2e koşusu tek IP'den art arda istek atar; yalnız demo modunda etkin gevşetme çarpanı
  # (ör. `RATE_LIMIT_DEMO_RELAX_MULTIPLIER=20 docker compose ... up`). Varsayılan 1 = kapalı.
  RATE_LIMIT_DEMO_RELAX_MULTIPLIER: "${RATE_LIMIT_DEMO_RELAX_MULTIPLIER:-1}"
  # Fraud IP hız kuralı (prod varsayılanı 10 ödeme/saat, app-config.ts): yerel demoda tüm
  # trafik Caddy arkasında tek istemci IP'sinden gelir; ardışık e2e/demo koşuları aksi hâlde
  # `velocity_ip` ile 3DS/ret alır. YALNIZ bu demo override'ında yükseltilir; temel compose ve
  # üretim davranışı değişmez (kullanıcı/kart hız kuralları prod değerinde kalır).
  FRAUD_VELOCITY_IP_MAX: "${FRAUD_VELOCITY_IP_MAX:-1000}"
  # P2-2: seed fotoğraflarının embedding'leriyle "benzerlerini göster" araması açık
  # (CLIP modeli imajda yoksa yeni yüklemeler embedding'siz kalır; arama yine çalışır).
  VISION_CLIP_ENABLED: "true"

services:
  migrate:
    environment: *demo-env
  app:
    environment: *demo-env
  worker:
    environment: *demo-env
  grpc:
    environment: *demo-env
