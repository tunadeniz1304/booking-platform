# Prometheus alarm kuralları (P0-6, v5 P0-5). Eşikler ve gerekçeler: docs/observability/SLO.md;
# her alarmın runbook'u docs/runbooks/<alarm>.md (annotations.runbook_url).
# Doğrulama: `promtool check rules alerts.yml` + `promtool test rules alerts.test.yml` (CI).
groups:
  - name: booking-slo
    rules:
      # SLO-1: rezervasyon oluşturma p99 < 1 s (5 dk pencere, 10 dk sürerse sayfa).
      - record: booking:create_latency_seconds:p99_5m
        expr: >
          histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{route=~"bookings|cart.hold",method="POST"}[5m])))
      - alert: BookingLatencyP99High
        expr: booking:create_latency_seconds:p99_5m > 1
        for: 10m
        labels: { severity: page, slo: booking-latency }
        annotations:
          summary: "Rezervasyon/tutma p99 gecikmesi 1 s üstünde"
          description: "p99 = {{ $value | humanizeDuration }} (SLO: < 1 s). Kilit çekişmesi, DB havuzu veya Redis gecikmesini kontrol edin."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/booking-latency-p99-high.md"

      # SLO-2: ödeme başarı oranı ≥ %97 (kullanıcı kaynaklı ret ve 3DS hariç, 30 dk pencere).
      - record: payment:success_ratio:30m
        expr: >
          sum(increase(payment_attempts_total{outcome="confirmed"}[30m]) + increase(cart_payment_total{outcome="confirmed"}[30m]))
          /
          clamp_min(sum(increase(payment_attempts_total{outcome=~"confirmed|capture_failed|compensated"}[30m]) + increase(cart_payment_total{outcome=~"confirmed|capture_failed|compensated"}[30m])), 1)
      - alert: PaymentSuccessRatioLow
        expr: payment:success_ratio:30m < 0.97 and sum(increase(payment_attempts_total[30m])) > 20
        for: 15m
        labels: { severity: page, slo: payment-success }
        annotations:
          summary: "Ödeme başarı oranı %97 altında"
          description: "Oran {{ $value | humanizePercentage }}. PSP durumu, saga telafileri (saga_compensation_total) ve refund_retry_total'a bakın."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payment-success-ratio-low.md"

      # SLO-3: defter dengesizliği = 0 (tek olay bile sayfa atar; beklemesiz).
      - alert: LedgerImbalanceDetected
        expr: sum by (source) (increase(ledger_imbalance_total[15m])) > 0
        labels: { severity: page, slo: ledger-balance }
        annotations:
          summary: "Çift girişli defterde dengesizlik ({{ $labels.source }})"
          description: "ledger_imbalance_total arttı. Ödemeleri durdurmayı değerlendirin; docs/observability/SLO.md runbook."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/ledger-imbalance-detected.md"
      - alert: LedgerReconciliationNotRunning
        expr: sum(increase(ledger_reconciliation_runs_total[26h])) == 0
        for: 1h
        labels: { severity: ticket, slo: ledger-balance }
        annotations:
          summary: "Günlük defter mutabakatı 26 saattir koşmadı"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/ledger-reconciliation-not-running.md"

      # SLO-4: 7565 kaldırma talepleri 24 saat içinde (ihlal sayısı 0).
      - alert: TakedownSlaBreached
        expr: sum by (source) (increase(takedown_sla_breach_total[1h])) > 0
        labels: { severity: page, slo: takedown-sla }
        annotations:
          summary: "Kaldırma talebi SLA'sı aşıldı ({{ $labels.source }})"
          description: "Yasal süre (varsayılan 24 saat) doldu; /admin/compliance kuyruğunu işleyin."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/takedown-sla-breached.md"

  - name: booking-money-hygiene
    rules:
      - alert: RefundRetryFailing
        expr: sum(increase(refund_retry_total{outcome=~"failed|exhausted"}[30m])) > 5
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Başarısız iade yeniden denemeleri birikiyor"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/refund-retry-failing.md"
      - alert: LatePaymentRefundSpike
        expr: sum(increase(payment_late_success_total{outcome="refunded"}[1h])) + sum(increase(cart_late_success_total{outcome="refunded"}[1h])) > 10
        labels: { severity: ticket }
        annotations:
          summary: "Geç gelen başarılı ödemeler topluca iade ediliyor (tutma TTL'i / PSP gecikmesi?)"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/late-payment-refund-spike.md"
      - alert: CaptureRaceCompensations
        expr: sum(increase(payment_capture_race_total[15m])) > 20
        labels: { severity: ticket }
        annotations:
          summary: "Çok sayıda yarış kaybı telafisi (çift ödeme denemesi) — istemci yeniden denemelerini inceleyin"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/capture-race-compensations.md"
      - alert: SplitPlansAborting
        expr: sum(increase(split_plan_total{outcome="aborted"}[1h])) > 5
        labels: { severity: ticket }
        annotations:
          summary: "Bölünmüş ödeme planları iptal oluyor (süre sonu ya da onay adımında serileştirme çakışması — abortReason'a bakın)"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/split-plans-aborting.md"
      - alert: SagaCompensationFailed
        # Telafi adımı başarısız (ör. PSP iadesi/void'i düştü). fix-sweep-3: saga bunu
        # `saga-compensation-retry` işine devreder → bilgi/izleme; asıl sayfa aşağıdaki iki kural.
        expr: sum by (saga, step) (increase(saga_compensation_total{outcome="failed"}[15m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: "Saga telafisi başarısız ({{ $labels.saga }}/{{ $labels.step }}) — otomatik yeniden deneme planlandı"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/saga-compensation-failed.md"
      - alert: SagaCompensationRetryNotScheduled
        # Telafi düştü ama yeniden deneme işi kuyruğa alınamadı (Redis/BullMQ) → elle müdahale.
        expr: >-
          sum by (saga) (increase(saga_compensation_total{outcome="failed"}[15m])) > 0
          unless sum by (saga) (increase(saga_compensation_retry_total{outcome="scheduled"}[15m])) > 0
        labels: { severity: page }
        annotations:
          summary: "Saga telafisi ({{ $labels.saga }}) başarısız ve yeniden deneme planlanamadı — PSP'de askıda tutar olabilir"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/saga-compensation-retry-not-scheduled.md"
      - alert: SagaCompensationRetryExhausted
        expr: sum by (saga) (increase(saga_compensation_retry_total{outcome="exhausted"}[30m])) > 0
        labels: { severity: page }
        annotations:
          summary: "Saga telafisi ({{ $labels.saga }}) tüm denemelerde düştü — elle void/iade (audit saga.compensation_exhausted)"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/saga-compensation-retry-exhausted.md"
      - alert: ConfirmRetryRefunds
        # Capture alınmış ödeme onay kuyruğunda da onaylanamayıp iade edildi (tutma düştü / bütçe bitti).
        expr: sum(increase(confirm_retry_total{outcome=~"refunded|exhausted_refunded"}[1h])) > 5
        labels: { severity: ticket }
        annotations:
          summary: "Ertelenen ödeme onaylarından saatte 5+ iade — SERIALIZABLE çakışma / envanter baskısı"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/confirm-retry-refunds.md"
      - alert: ConfirmRetryExhausted
        expr: sum(increase(confirm_retry_total{outcome="exhausted"}[30m])) > 0
        labels: { severity: page }
        annotations:
          summary: "confirm-retry işi tüm denemelerde düştü — capture alınmış ödeme onaysız/iadesiz kalmış olabilir"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/confirm-retry-exhausted.md"
      - alert: PayoutFailures
        expr: sum(increase(payouts_total{outcome=~"failed|error"}[1h])) > 0
        labels: { severity: ticket }
        annotations:
          summary: "Ev sahibi / devir payout hatası"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payout-failures.md"
      - alert: LlmTokenBurnHigh
        expr: sum by (route) (increase(llm_tokens_total[1h])) > 2e6
        labels: { severity: ticket }
        annotations:
          summary: "LLM token tüketimi {{ $labels.route }} rotasında saatlik 2M üstünde"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/llm-token-burn-high.md"

  # v5 P0-5 — çok pencereli burn-rate alarmları (Google SRE Workbook, bölüm 5).
  # Hata oranı / hata bütçesi = yanma hızı. Hızlı: 1 s & 5 dk > 14,4x veya 6 s & 30 dk > 6x
  # (page; bütçenin %2'si 1 saatte / %5'i 6 saatte). Yavaş: 1 g & 2 s > 3x (ticket).
  # Kısa pencere, sorun geçince alarmın hızla susmasını sağlar.
  #   SLO-5 rezervasyon başarısı : POST bookings|cart.hold 5xx olmayan ≥ %99,5 (bütçe 0,005)
  #   SLO-6 ödeme onay gecikmesi : 3DS onayı (bookings|cart.pay.confirm) %99'u < 2,5 s (p99 < 2,5 s; bütçe 0,01)
  #   SLO-7 webhook gecikmesi    : payments.webhook %99'u < 1 s (p99 < 1 s; bütçe 0,01)
  - name: booking-slo-burn-rate
    rules:
      - record: slo:booking_error_ratio:rate5m
        expr: >-
          sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST"}[5m])), 1e-12)
      - record: slo:payment_confirm_slow_ratio:rate5m
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[5m]))
            -
            sum(rate(http_request_duration_seconds_bucket{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST",le="2.5"}[5m]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[5m])), 1e-12)
      - record: slo:webhook_slow_ratio:rate5m
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[5m]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="payments.webhook",le="1"}[5m]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[5m])), 1e-12)
      - record: slo:booking_error_ratio:rate30m
        expr: >-
          sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST",status=~"5.."}[30m]))
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST"}[30m])), 1e-12)
      - record: slo:payment_confirm_slow_ratio:rate30m
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[30m]))
            -
            sum(rate(http_request_duration_seconds_bucket{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST",le="2.5"}[30m]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[30m])), 1e-12)
      - record: slo:webhook_slow_ratio:rate30m
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[30m]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="payments.webhook",le="1"}[30m]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[30m])), 1e-12)
      - record: slo:booking_error_ratio:rate1h
        expr: >-
          sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST",status=~"5.."}[1h]))
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST"}[1h])), 1e-12)
      - record: slo:payment_confirm_slow_ratio:rate1h
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[1h]))
            -
            sum(rate(http_request_duration_seconds_bucket{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST",le="2.5"}[1h]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[1h])), 1e-12)
      - record: slo:webhook_slow_ratio:rate1h
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[1h]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="payments.webhook",le="1"}[1h]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[1h])), 1e-12)
      - record: slo:booking_error_ratio:rate2h
        expr: >-
          sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST",status=~"5.."}[2h]))
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST"}[2h])), 1e-12)
      - record: slo:payment_confirm_slow_ratio:rate2h
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[2h]))
            -
            sum(rate(http_request_duration_seconds_bucket{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST",le="2.5"}[2h]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[2h])), 1e-12)
      - record: slo:webhook_slow_ratio:rate2h
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[2h]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="payments.webhook",le="1"}[2h]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[2h])), 1e-12)
      - record: slo:booking_error_ratio:rate6h
        expr: >-
          sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST",status=~"5.."}[6h]))
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST"}[6h])), 1e-12)
      - record: slo:payment_confirm_slow_ratio:rate6h
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[6h]))
            -
            sum(rate(http_request_duration_seconds_bucket{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST",le="2.5"}[6h]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[6h])), 1e-12)
      - record: slo:webhook_slow_ratio:rate6h
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[6h]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="payments.webhook",le="1"}[6h]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[6h])), 1e-12)
      - record: slo:booking_error_ratio:rate1d
        expr: >-
          sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST",status=~"5.."}[1d]))
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings|cart.hold",method="POST"}[1d])), 1e-12)
      - record: slo:payment_confirm_slow_ratio:rate1d
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[1d]))
            -
            sum(rate(http_request_duration_seconds_bucket{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST",le="2.5"}[1d]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route=~"bookings.pay.confirm|cart.pay.confirm",method="POST"}[1d])), 1e-12)
      - record: slo:webhook_slow_ratio:rate1d
        expr: >-
          (
            sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[1d]))
            -
            sum(rate(http_request_duration_seconds_bucket{route="payments.webhook",le="1"}[1d]))
          )
          /
          clamp_min(sum(rate(http_request_duration_seconds_count{route="payments.webhook"}[1d])), 1e-12)
      - alert: BookingSuccessBurnRateFast
        expr: >-
          (slo:booking_error_ratio:rate1h > (14.4 * 0.005) and slo:booking_error_ratio:rate5m > (14.4 * 0.005))
          or
          (slo:booking_error_ratio:rate6h > (6 * 0.005) and slo:booking_error_ratio:rate30m > (6 * 0.005))
        for: 2m
        labels: { severity: page, slo: booking-success }
        annotations:
          summary: "Rezervasyon/tutma 5xx oranı SLO'yu (≥ %99,5) tehdit ediyor — hata bütçesi hızlı yanıyor"
          description: "Tetikleyen uzun pencerede SLO dışı istek oranı {{ $value | humanizePercentage }}; bu hızla aylık bütçe günler içinde biter."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/booking-success-burn-rate.md"
      - alert: BookingSuccessBurnRateSlow
        expr: slo:booking_error_ratio:rate1d > (3 * 0.005) and slo:booking_error_ratio:rate2h > (3 * 0.005)
        for: 1h
        labels: { severity: ticket, slo: booking-success }
        annotations:
          summary: "Rezervasyon/tutma 5xx oranı SLO'yu (≥ %99,5) tehdit ediyor — hata bütçesi yavaş ama sürekli yanıyor"
          description: "1 günlük oran {{ $value | humanizePercentage }} (bütçenin 3 katı)."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/booking-success-burn-rate.md"
      - alert: PaymentConfirmLatencyBurnRateFast
        expr: >-
          (slo:payment_confirm_slow_ratio:rate1h > (14.4 * 0.01) and slo:payment_confirm_slow_ratio:rate5m > (14.4 * 0.01))
          or
          (slo:payment_confirm_slow_ratio:rate6h > (6 * 0.01) and slo:payment_confirm_slow_ratio:rate30m > (6 * 0.01))
        for: 2m
        labels: { severity: page, slo: payment-confirm-latency }
        annotations:
          summary: "3DS ödeme onayı p99 2,5 s SLO'su — hata bütçesi hızlı yanıyor"
          description: "Tetikleyen uzun pencerede SLO dışı istek oranı {{ $value | humanizePercentage }}; bu hızla aylık bütçe günler içinde biter."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payment-confirm-latency-burn-rate.md"
      - alert: PaymentConfirmLatencyBurnRateSlow
        expr: slo:payment_confirm_slow_ratio:rate1d > (3 * 0.01) and slo:payment_confirm_slow_ratio:rate2h > (3 * 0.01)
        for: 1h
        labels: { severity: ticket, slo: payment-confirm-latency }
        annotations:
          summary: "3DS ödeme onayı p99 2,5 s SLO'su — hata bütçesi yavaş ama sürekli yanıyor"
          description: "1 günlük oran {{ $value | humanizePercentage }} (bütçenin 3 katı)."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payment-confirm-latency-burn-rate.md"
      - alert: WebhookLatencyBurnRateFast
        expr: >-
          (slo:webhook_slow_ratio:rate1h > (14.4 * 0.01) and slo:webhook_slow_ratio:rate5m > (14.4 * 0.01))
          or
          (slo:webhook_slow_ratio:rate6h > (6 * 0.01) and slo:webhook_slow_ratio:rate30m > (6 * 0.01))
        for: 2m
        labels: { severity: page, slo: webhook-latency }
        annotations:
          summary: "PSP webhook p99 1 s SLO'su — hata bütçesi hızlı yanıyor"
          description: "Tetikleyen uzun pencerede SLO dışı istek oranı {{ $value | humanizePercentage }}; bu hızla aylık bütçe günler içinde biter."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/webhook-latency-burn-rate.md"
      - alert: WebhookLatencyBurnRateSlow
        expr: slo:webhook_slow_ratio:rate1d > (3 * 0.01) and slo:webhook_slow_ratio:rate2h > (3 * 0.01)
        for: 1h
        labels: { severity: ticket, slo: webhook-latency }
        annotations:
          summary: "PSP webhook p99 1 s SLO'su — hata bütçesi yavaş ama sürekli yanıyor"
          description: "1 günlük oran {{ $value | humanizePercentage }} (bütçenin 3 katı)."
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/webhook-latency-burn-rate.md"

  # v5 P0-5 — v5 ile gelen para/destek/LLM metrikleri.
  - name: booking-v5-hygiene
    rules:
      - alert: PayoutBlockedSpike
        # Uyum/KYC/hesap bekletmesiyle durdurulan payout'lar (payout_blocked_total{kind,reason}).
        expr: sum by (kind, reason) (increase(payout_blocked_total[1h])) > 10
        labels: { severity: ticket }
        annotations:
          summary: "Saatte 10+ payout engellendi ({{ $labels.kind }}/{{ $labels.reason }})"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/payout-blocked-spike.md"
      - alert: DepositCaptureSweepFailing
        # CAPTURING'de takılı depozito taraması PSP tahsilatını kapatamıyor.
        expr: sum(increase(deposit_capture_sweep_total{outcome="failed"}[1h])) > 0
        for: 30m
        labels: { severity: page }
        annotations:
          summary: "Takılı depozito tahsilatları taramada kapatılamıyor — PSP'de askıda tutar olabilir"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/deposit-capture-sweep-failing.md"
      - alert: RnplChargeFailures
        # Şimdi rezerve et, sonra öde: planlı tahsilat düştü ya da süre dolup iptal edildi.
        expr: sum(increase(rnpl_charge_total{outcome=~"failed|defaulted"}[1h])) > 5
        labels: { severity: ticket }
        annotations:
          summary: "RNPL tahsilatlarında saatte 5+ başarısızlık/temerrüt"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/rnpl-charge-failures.md"
      - alert: SupportHandoffRatioHigh
        # Destek ajanı konuşmalarının yarısından fazlası insana devrediliyor (≥ 20 konuşma).
        expr: >-
          sum(increase(support_handoff_total[1h])) / clamp_min(sum(increase(support_chat_total[1h])), 1) > 0.5
          and sum(increase(support_chat_total[1h])) >= 20
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Destek ajanında insana devir oranı %50 üstünde"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/support-handoff-ratio-high.md"
      - alert: LlmEvalScoreLow
        # llm:eval özetinden yüklenen gösterge; CI kapısıyla aynı eşik (LLM_EVAL_MIN_PASS_RATE).
        expr: min by (task, mode) (llm_eval_score) < 0.95
        labels: { severity: ticket }
        annotations:
          summary: "LLM eval geçme oranı %95 altında ({{ $labels.task }}/{{ $labels.mode }})"
          runbook_url: "https://github.com/tunadeniz1304/booking-platform/blob/main/docs/runbooks/llm-eval-score-low.md"
