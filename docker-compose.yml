# Tek komutla tam demo: `cp .env.example .env && docker compose up --build`
#
# - Postgres ve Redis host'a AÇILMAZ (yalnızca iç ağ). Yerel geliştirme için
#   `docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db redis`.
# - Sırlar imajda yok; `.env`'de verilmezse `secrets-init` rastgele üretir.
# - Opsiyonel profil: `observability` (Prometheus/Grafana/Tempo).

# Tüm uygulama servislerinde ortak ortam (v3#16). Servisler `environment`'ı
# `<<: *common-env` ile GENİŞLETİR; haritayı yeniden tanımlamak değişkenleri
# sessizce düşürmez (YAML merge yalnızca üst düzey anahtarları birleştirir).
x-common-env: &common-env
  NODE_ENV: production
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-booking}
  POSTGRES_DB: ${POSTGRES_DB:-booking}
  REDIS_HOST: redis
  DATABASE_URL: ""
  REDIS_URL: ""
  # Demo ortamında sırlar daima `secrets-init` üretimidir (.env'deki değerler ezilir).
  JWT_SECRET: ""
  INTERNAL_API_SECRET: ""
  TRANSFER_SIGNING_SECRET: ""
  PSP_WEBHOOK_SECRET: ""
  METRICS_TOKEN: ""
  CHANNEL_FEED_SECRET: ""
  GRPC_HOST: grpc
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # v3#11: açık demo bayrağı (false → demo seed reddedilir, /dev/mailbox 404).
  DEMO_MODE: ${DEMO_MODE:-true}

x-app-env: &app-env
  env_file:
    - path: .env
      required: false
  environment:
    <<: *common-env
  volumes:
    - booking_secrets:/run/booking-secrets:ro

services:
  secrets-init:
    build: { context: ., target: worker }
    image: booking-platform-worker
    user: "0:0"
    entrypoint: ["node", "scripts/gen-secrets.mjs"]
    command: []
    volumes:
      - booking_secrets:/run/booking-secrets
    restart: "no"

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_PASSWORD_FILE: /run/booking-secrets/POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - booking_secrets:/run/booking-secrets:ro
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/booking-secrets/REDIS_PASSWORD)"
    volumes:
      - redis_data:/data
      - booking_secrets:/run/booking-secrets:ro
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$(cat /run/booking-secrets/REDIS_PASSWORD)" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20

  # Tek seferlik: migration + (DEMO_MODE=true ise ve veritabanı boşsa) demo verisi.
  migrate:
    image: booking-platform-worker
    <<: *app-env
    command: ["npx", "tsx", "scripts/migrate-and-seed.ts"]
    depends_on:
      secrets-init: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: web }
    image: booking-platform-web
    <<: *app-env
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: booking-platform-worker
    <<: *app-env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }

  # İç gRPC servisi: yalnızca compose ağında erişilebilir (host'a port açılmaz).
  grpc:
    image: booking-platform-worker
    <<: *app-env
    environment:
      <<: *common-env
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50051"
    command: ["npx", "tsx", "--conditions=react-server", "services/grpc/main.ts"]
    expose:
      - "50051"
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }

  # --- Gözlemlenebilirlik (opsiyonel): docker compose --profile observability up ---
  # İz göndermek için .env: OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - booking_secrets:/run/booking-secrets:ro
    ports:
      # Başka projelerle çakışmasın diye host portu ayarlanabilir (v3#16).
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  tempo:
    image: grafana/tempo:2.5.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./docker/observability/tempo.yml:/etc/tempo.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/observability:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

volumes:
  postgres_data:
  redis_data:
  booking_secrets:
