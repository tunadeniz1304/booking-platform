# v5 P1-6: bağımlılık ve action sürüm güncellemeleri. Action'lar SHA ile pinli olduğundan
# Dependabot hem SHA'yı hem yanındaki `# vX.Y.Z` yorumunu birlikte günceller.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Küçük/yama sürümleri tek PR'da; majörler ayrı PR (geçiş notu gerektirir).
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
