// İç servis sözleşmesi — protobuf v3
// Next.js uygulaması ile bağımsız backend servis modülleri arasındaki
// gRPC/Protobuf arayüzü. Dinamik yükleme (@grpc/proto-loader) kullanılır.
syntax = "proto3";

package booking.v1;

// YYYY-MM-DD; aralık [start, end) yarı-açıktır (checkIn <= d < checkOut).
message DateRange {
  string start = 1;
  string end = 2;
}

// --- InventoryService ----------------------------------------------------

message RoomAvailabilityRequest {
  string room_id = 1;
  DateRange range = 2;
}

message PricePoint {
  string date = 1;
  double price = 2;
  bool available = 3;
}

message RoomAvailabilityResponse {
  bool available = 1;
  repeated PricePoint prices = 2;
  double estimated_total = 3;
  string currency = 4;
  int32 available_rooms = 5;
  // v3#9: tek fiyat kaynağı (computeTotal) — oda farkı + vergiler dahil, minor-unit.
  // `estimated_total` (double) bir sürüm boyunca geriye uyumluluk için korunur.
  int64 estimated_total_minor = 6;
}

// --- BookingService ------------------------------------------------------

message ReserveRoomRequest {
  string room_id = 1;
  string property_id = 2;
  DateRange range = 3;
  int32 guest_count = 4;
  // Yazar (caller) kullanıcı — BOLA denetimleri için servis tarafında da doğrulanır.
  string requester_id = 5;
  string idempotency_key = 6;
}

message ReserveRoomResponse {
  string booking_id = 1;
  string status = 2;
  // v5 (ADR 0033): ondalık `total_price` kaldırıldı; tutar yalnız minor-unit.
  reserved 3;
  reserved "total_price";
  string currency = 4;
  int64 total_price_minor = 5;
}

// --- PaymentService ------------------------------------------------------

message ChargeRequest {
  string booking_id = 1;
  // v5 (ADR 0033): `amount` kaldırıldı; tutar daima rezervasyondan alınır.
  reserved 2;
  reserved "amount";
  string currency = 3;
  // Geriye dönük uyumluluk: doluysa token'daki kullanıcıyla aynı olmalıdır.
  string requester_id = 4;
  // PSP kart token'ı (kart verisi servise gelmez).
  string card_token = 5;
  // ZORUNLU (v3#1): boşsa INVALID_ARGUMENT. Çift tahsilatı ayrıca booking kilidi önler.
  string idempotency_key = 6;
}

message ChargeResponse {
  string payment_id = 1;
  string status = 2;
  // v5 (ADR 0033): ondalık `charged_amount` kaldırıldı; `charged_amount_minor` kullanılır.
  reserved 3;
  reserved "charged_amount";
  int64 charged_amount_minor = 4;
  string currency = 5;
}

service InventoryService {
  rpc GetRoomAvailability(RoomAvailabilityRequest) returns (RoomAvailabilityResponse);
}

service BookingService {
  rpc ReserveRoom(ReserveRoomRequest) returns (ReserveRoomResponse);
}

service PaymentService {
  rpc Charge(ChargeRequest) returns (ChargeResponse);
}

// --- AriService (kanal yöneticisi simülatörü) ------------------------------

message AriUpdate {
  string date = 1;
  double price = 2;
  bool has_price = 3;
  bool available = 4;
  bool has_available = 5;
}

message PushAvailabilityRequest {
  string room_id = 1;
  // Oda başına monoton artan sıra numarası; eski/eşit numara reddedilir.
  int64 sequence = 2;
  // Aynı anahtarla tekrar gönderim tek etki yapar.
  string idempotency_key = 3;
  repeated AriUpdate updates = 4;
}

message PushAvailabilityResponse {
  string status = 1;
  int32 applied = 2;
}

service AriService {
  rpc PushAvailability(PushAvailabilityRequest) returns (PushAvailabilityResponse);
}
