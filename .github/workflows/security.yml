name: Security

# v5 P1-6 (v5#13): tedarik zinciri güvenliği — SAST, secret taraması, SBOM, bağımlılık
# açığı geçidi, SLSA provenance ve OpenSSF Scorecard. Tüm action'lar tam commit SHA ile,
# tüm container imajları digest ile pinlidir; sürümler Dependabot ile güncellenir.
# Karar kaydı: docs/adr/0031-supply-chain-provenance.md.
on:
  push:
  pull_request:
  schedule:
    # Haftalık: yeni yayımlanan CVE'ler kod değişmeden de yakalanır.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: SAST (Semgrep CE)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6 # 1.140.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bulgu → çıkış 1. Testler ve üretilen kod taranmaz (fikstürler kasıtlı olarak "kötü").
      - name: semgrep scan
        run: >-
          semgrep scan --config p/typescript --config p/javascript
          --error --metrics=off
          --exclude tests --exclude "*.test.ts" --exclude node_modules --exclude .next

  codeql:
    name: SAST (CodeQL)
    # Code scanning private kişisel repoda GitHub Advanced Security ister (V-6).
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  gitleaks:
    name: Secret taraması (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tüm geçmiş taranır: silinmiş ama commit'lenmiş sır da bulgudur.
          fetch-depth: 0
      # Değerler rapora yazılmaz (--redact). Test sabitleri .gitleaksignore'da parmak iziyle.
      - name: gitleaks detect
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          detect --source /repo --redact --no-banner --exit-code 1

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Yalnız lockfile'dan (kurulum yok); üretim bağımlılıkları.
      - name: cyclonedx-npm
        run: >-
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1
          --package-lock-only --omit dev
          --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  osv:
    name: Bağımlılık açıkları (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bilinen açık → kırmızı. Gerekçeli ve süreli istisnalar: osv-scanner.toml.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json

  provenance:
    name: SLSA provenance (standalone çıktı)
    # attest-build-provenance private repoda GitHub Enterprise Cloud ister (V-6);
    # PR'larda imzalanacak bir yayın çıktısı yok.
    if: github.event.repository.private == false && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LLM_MODE: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package standalone output
        run: tar -czf booking-standalone.tar.gz -C .next standalone
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: booking-standalone.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: booking-standalone
          path: booking-standalone.tar.gz
          retention-days: 14

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard public repo ister (V-6); yalnız varsayılan dalda anlamlı.
    if: github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
