name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Testler .env yüklemez ve ağa çıkmaz; LLM daima demo modunda.
  LLM_MODE: demo

jobs:
  quality:
    name: Lint · Typecheck · Format · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit

  integration:
    name: Integration (testcontainers · pgvector + redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Container imajları: pgvector/pgvector:pg16 ve redis:7-alpine (testcontainers ile).
      # Docker burada mevcut → unit + integration birlikte koşar ve %80 satır
      # kapsam eşiği (vitest.config.mts) burada zorlanır.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Next build · Docker images
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose build
      - run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright · docker compose demo)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # README'deki "30 saniyede çalıştır" yolu: .env.example → .env (anahtar yok → LLM demo).
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for /api/ready
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/ready; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 migrate app worker
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: failure()
        run: docker compose logs --tail=300 app worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: docker compose down -v
