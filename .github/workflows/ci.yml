name: CI

# v5 P1-6 (v5#13): tüm dallarda her push ve PR (dal filtresi yok).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Testler .env yüklemez ve ağa çıkmaz; LLM daima demo modunda.
  LLM_MODE: demo

jobs:
  quality:
    name: Lint · Typecheck · Format · i18n · MCP smoke · Unit · LLM eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # tr/en anahtar eşitliği (P1-12); eksik/fazla anahtar → çıkış 1.
      - run: npm run i18n:check
      # MCP stdio + streamable HTTP duman testi (P1-11); DB gerektirmez.
      - run: npm run mcp:smoke
      - run: npm run test:unit
      # v5 P1-5: LLM eval (promptfoo, demo sağlayıcı — ağsız); geçme oranı < %95 → kırmızı.
      - run: npm run llm:eval

  workflow-lint:
    name: actionlint · promtool (alarm kuralları + birim testleri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # İmajlar digest ile pinli (tag kayması tedarik zinciri riskidir; v5 P1-6).
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color
      # v5 P0-5: alarm kuralları sözdizimi + promtool birim testleri (alerts.test.yml).
      - name: promtool check rules
        run: >-
          docker run --rm -v "$PWD/docker/observability:/w" --entrypoint promtool
          prom/prometheus@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
          check rules /w/alerts.yml
      - name: promtool test rules
        run: >-
          docker run --rm -v "$PWD/docker/observability:/w" --entrypoint promtool
          prom/prometheus@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
          test rules /w/alerts.test.yml

  integration:
    name: Integration (testcontainers · pgvector + redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Container imajları: pgvector/pgvector:pg16 ve redis:7-alpine (testcontainers ile).
      # Docker burada mevcut → unit + integration birlikte koşar; kapsam
      # (src/lib, src/app/api, services, src/worker) eşikleri vitest.config.mts'te:
      # satır ≥ %80, dal ≥ %70. GitHub Actions `CI=true` ayarlar: Docker yoksa
      # entegrasyon suite'i sessizce atlanmaz, global-setup hata verir (v3 F0).
      - run: docker info --format '{{.ServerVersion}}'
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Next build · Docker images
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose build
      - run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright · docker compose demo)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    env:
      # Temel compose güvenli varsayılanlıdır; e2e demo override'ı ile koşar (v4#5).
      COMPOSE_FILE: docker-compose.yml:docker-compose.demo.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # README'deki "30 saniyede çalıştır" yolu: .env.example → .env (anahtar yok → LLM demo).
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for /api/ready
        run: |
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/ready; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 migrate app worker
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: failure()
        run: docker compose logs --tail=300 app worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: docker compose down -v
